<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eni Memory s'inscrire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Eni-Memory-S'inscrire</h1>

    <nav id="menu-principal">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="inscription.html">S'inscrire</a></li>
                <li><a href="connexion.html">Se connecter</a></li>
                <li><a href="profil.html">Profil</a></li>
                <li><a href="jouer.html">Jouer</a></li>
            </ul>
        </nav>

    <main class="inscription">
      <form action="" method="post">
        <fieldset>
          <legend>Inscrivez-vous</legend>
      
        <label for="nom">Nom d'utilisateur* :</label>
        <input
          type="text"
          id="nom"
          name="nom"
          autofocus
          required
          placeholder="3 caractères minimum"
          pattern="[A-Za-z]{3,}"
          title="Saisissez votre nom (3 caractères min.)"
        />
      
        <label for="email">Entrez votre email : </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Votre email"
          title="Saisissez votre adresse email"
        />
        
        
        <label for="motdePasse">Mot de passe :</label>
        <input
          type="password"
          id="motdePasse"
          name="motdePasse"
          placeholder="Votre mot de passe"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
          title="Saisissez votre mot de passe de minimum 8 caractères comportant
          des lettres minuscules et majuscules et des chiffres"
        />
      
        <label for="confirmation">Confirmez le mot de passe :</label>
        <input
          type="password"
          id="confirmation"
          name="confirmation"
          placeholder="Confirmer le mot de passe"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
          title="Saisissez votre mot de passe de minimum 8 caractères comportant
          des lettres minuscules et majuscules et des chiffres"
          />
        <div class ="boutons">
          <input type="submit" value="Création du compte" />
          <input type="reset" value="Annuler" />
        </div>
        </fieldset>
      </form>
    </main>
  </body>
</html>
